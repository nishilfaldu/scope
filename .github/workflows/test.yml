name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: test
        run: pnpm test 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
      - name: lint
        run: pnpm lint 2>&1 | tee lint-output.txt; exit ${PIPESTATUS[0]}
      - name: next build (no convex deploy)
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          CONVEX_DEPLOYMENT: dev:example
        run: pnpm exec next build 2>&1 | tee next-build-output.txt; exit ${PIPESTATUS[0]}
      - name: Comment CI failure output on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p, fallback) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : fallback;
            const clip = (s) => s.trimEnd().split('\n').slice(-150).join('\n');
            const body = [
              '## CI failure dump (temporary — includes next build)',
              '',
              `head: \`${context.sha.slice(0, 7)}\``,
              '',
              '### pnpm test (last 150 lines)',
              '```',
              clip(read('test-output.txt', '(missing)')),
              '```',
              '',
              '### pnpm lint (last 150 lines)',
              '```',
              clip(read('lint-output.txt', '(missing — earlier step failed)')),
              '```',
              '',
              '### next build (last 150 lines)',
              '```',
              clip(read('next-build-output.txt', '(missing — earlier step failed)')),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
